name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "37 21 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  UV_LINK_MODE: hardlink

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-release-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Skip outside pull requests
        if: github.event_name != 'pull_request'
        run: echo "release contract is a pull-request check"

      - uses: actions/checkout@v7.0.1
        if: ${{ github.event_name == 'pull_request' && !startsWith(github.event.pull_request.head.ref, 'dependabot/') }}
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v7.0.0
        if: ${{ github.event_name == 'pull_request' && !startsWith(github.event.pull_request.head.ref, 'dependabot/') }}
        with:
          python-version: "3.14"

      - uses: astral-sh/setup-uv@v10.0.1
        if: ${{ github.event_name == 'pull_request' && !startsWith(github.event.pull_request.head.ref, 'dependabot/') }}
        with:
          enable-cache: true

      - name: Validate release-please PR contract
        if: ${{ github.event_name == 'pull_request' && !startsWith(github.event.pull_request.head.ref, 'dependabot/') }}
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          uv run python scripts/validate_release_config.py
          uv run python scripts/validate_pr_title.py --title "${PR_TITLE}"
          uv run python -m scripts.validate_pr_commits --base-sha "${BASE_SHA}" --head-sha "${HEAD_SHA}"
          if [[ "${HEAD_REF}" == release-please--* ]]; then
            exit 0
          fi
          count="$(git rev-list --no-merges --count "${BASE_SHA}..${HEAD_SHA}")"
          printf '%s' "${PR_BODY}" \
            | uv run python -m scripts.validate_release_notes --body-file - --commit-count "${count}"

      - name: Verify release package
        if: ${{ github.event_name == 'pull_request' && startsWith(github.event.pull_request.head.ref, 'release-please--') }}
        run: uv run python scripts/check_packaging_smoke.py

  quality:
    if: ${{ github.event_name != 'pull_request' || !startsWith(github.event.pull_request.head.ref, 'release-please--') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.14"

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Install dependencies
        run: uv sync --locked

      - name: Static quality gate
        run: just check

  test:
    if: ${{ github.event_name != 'pull_request' || !startsWith(github.event.pull_request.head.ref, 'release-please--') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.14"

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Install dependencies
        run: uv sync --locked

      - name: Unit tests
        run: just unit

  crap:
    if: ${{ github.event_name != 'pull_request' || !startsWith(github.event.pull_request.head.ref, 'release-please--') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.14"

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Install dependencies
        run: uv sync --locked

      - name: CRAP gate
        run: just crap-check

  docker-build:
    if: ${{ github.event_name != 'pull_request' || !startsWith(github.event.pull_request.head.ref, 'release-please--') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Build supported Docker images
        run: just docker-build

  runtime-smoke:
    if: ${{ github.event_name != 'pull_request' || !startsWith(github.event.pull_request.head.ref, 'release-please--') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Runtime smoke
        run: just runtime-smoke


  ci:
    if: always()
    runs-on: ubuntu-latest
    needs: [pr-release-contract, quality, test, crap, docker-build, runtime-smoke]
    steps:
      - name: Check required jobs
        run: |
          if [ "${{ contains(needs.*.result, 'failure') }}" = "true" ] || \
             [ "${{ contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            exit 1
          fi
