name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]
  schedule:
    - cron: "37 21 * * *"
  workflow_dispatch:
    inputs:
      release_attestation:
        description: Run the release-PR contract against supplied immutable metadata.
        required: false
        type: boolean
        default: false
      pr_title:
        description: Exact release PR title.
        required: false
        type: string
      pr_body:
        description: Exact release PR body.
        required: false
        type: string
      base_sha:
        description: Exact release PR base commit.
        required: false
        type: string
      head_sha:
        description: Exact release PR head commit.
        required: false
        type: string
      head_ref:
        description: Exact release PR head branch.
        required: false
        type: string
      head_repo:
        description: Exact release PR head repository.
        required: false
        type: string
      pr_author:
        description: Exact release PR author.
        required: false
        type: string

permissions:
  contents: read

env:
  UV_LINK_MODE: hardlink

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.classify.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: classify
        name: Classify changed files
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "${EVENT_NAME}" = "schedule" ] || [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "${EVENT_NAME}" = "pull_request" ]; then
            base="${PR_BASE_SHA}"
            head="${PR_HEAD_SHA}"
          else
            base="${BEFORE_SHA}"
            head="${HEAD_SHA}"
            if [[ "${base}" =~ ^0+$ ]]; then
              echo "code=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          if [[ ! "${base}" =~ ^[0-9a-fA-F]{40,64}$ || ! "${head}" =~ ^[0-9a-fA-F]{40,64}$ ]]; then
            echo "::error::cannot classify changes without valid base and head commits"
            exit 1
          fi
          git diff --name-only --no-renames -z "${base}" "${head}" -- > changed-files.bin
          if [ ! -s changed-files.bin ]; then
            echo "code=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          code=false
          while IFS= read -r -d '' path; do
            case "${path}" in
              .planning/*|docs/*|README.md|AGENTS.md|LICENSE|CHANGELOG.md|*.md) ;;
              *) code=true; break ;;
            esac
          done < changed-files.bin
          echo "code=${code}" >> "$GITHUB_OUTPUT"

  pr-release-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Skip outside pull requests
        if: ${{ github.event_name != 'pull_request' && !inputs.release_attestation }}
        run: echo "release contract is a pull-request check"

      - name: Verify release-attestation metadata
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.release_attestation }}
        env:
          PR_TITLE: ${{ inputs.pr_title }}
          PR_BODY: ${{ inputs.pr_body }}
          BASE_SHA: ${{ inputs.base_sha }}
          HEAD_SHA: ${{ inputs.head_sha }}
          HEAD_REF: ${{ inputs.head_ref }}
          HEAD_REPO: ${{ inputs.head_repo }}
          PR_AUTHOR: ${{ inputs.pr_author }}
        run: |
          set -euo pipefail
          for name in PR_TITLE PR_BODY BASE_SHA HEAD_SHA HEAD_REF HEAD_REPO PR_AUTHOR; do
            [ -n "${!name}" ] || (echo "::error::missing release-attestation input ${name}" && exit 1)
          done
          [ "${HEAD_SHA}" = "${GITHUB_SHA}" ] || (echo "::error::attested head SHA does not match the dispatch SHA" && exit 1)
          [ "${HEAD_REF}" = "${GITHUB_REF_NAME}" ] || (echo "::error::attested head ref does not match the dispatch ref" && exit 1)
          [ "${HEAD_REPO}" = "${GITHUB_REPOSITORY}" ] || (echo "::error::attested head repository is not this repository" && exit 1)

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ github.event_name == 'pull_request' || inputs.release_attestation }}
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || inputs.head_sha }}

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: ${{ github.event_name == 'pull_request' || inputs.release_attestation }}
        with:
          python-version: "3.14"

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        if: ${{ github.event_name == 'pull_request' || inputs.release_attestation }}
        with:
          enable-cache: true

      - name: Bind checkout to attested PR commits
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.release_attestation }}
        env:
          BASE_SHA: ${{ inputs.base_sha }}
          HEAD_SHA: ${{ inputs.head_sha }}
        run: |
          set -euo pipefail
          [ "$(git rev-parse HEAD)" = "${HEAD_SHA}" ] || (echo "::error::checkout did not resolve the attested head SHA" && exit 1)
          git merge-base --is-ancestor "${BASE_SHA}" "${HEAD_SHA}" \
            || (echo "::error::attested base SHA is not an ancestor of the head SHA" && exit 1)

      - name: Validate release-please PR contract
        if: ${{ github.event_name == 'pull_request' || inputs.release_attestation }}
        env:
          PR_TITLE: ${{ github.event_name == 'pull_request' && github.event.pull_request.title || inputs.pr_title }}
          PR_BODY: ${{ github.event_name == 'pull_request' && github.event.pull_request.body || inputs.pr_body }}
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || inputs.base_sha }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || inputs.head_sha }}
          HEAD_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || inputs.head_ref }}
          HEAD_REPO: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || inputs.head_repo }}
          PR_AUTHOR: ${{ github.event_name == 'pull_request' && github.event.pull_request.user.login || inputs.pr_author }}
          RELEASE_BRANCH: release-please--branches--main--components--omi-collector
        run: |
          set -euo pipefail
          uv run python scripts/validate_release_config.py
          uv run python scripts/validate_pr_title.py --title "${PR_TITLE}"
          uv run python -m scripts.validate_pr_commits --base-sha "${BASE_SHA}" --head-sha "${HEAD_SHA}" --title-only-squash
          if [[ "${HEAD_REF}" == "${RELEASE_BRANCH}" &&
                "${HEAD_REPO}" == "${GITHUB_REPOSITORY}" &&
                "${PR_AUTHOR}" == "github-actions[bot]" ]]; then
            exit 0
          fi
          count="$(git rev-list --no-merges --count "${BASE_SHA}..${HEAD_SHA}")"
          printf '%s' "${PR_BODY}" \
            | uv run python -m scripts.validate_release_notes --body-file - --commit-count "${count}" --base-sha "${BASE_SHA}" --head-sha "${HEAD_SHA}"

  quality:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true

      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2
        with:
          tool: just

      - name: Install dependencies
        run: uv sync --locked

      - name: Static quality gate
        run: just check

  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true

      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2
        with:
          tool: just

      - name: Install dependencies
        run: uv sync --locked

      - name: Full test and CRAP gates
        run: just crap-check

  deps-audit:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true

      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2
        with:
          tool: just

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Audit locked dependencies
        run: just deps-audit

  runtime-smoke:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2
        with:
          tool: just

      - name: Build image and run runtime smoke
        run: just runtime-smoke


  ci:
    if: always()
    runs-on: ubuntu-latest
    needs: [changes, pr-release-contract, quality, test, deps-audit, runtime-smoke]
    steps:
      - name: Check required jobs
        run: |
          if [ "${{ contains(needs.*.result, 'failure') }}" = "true" ] || \
             [ "${{ contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            exit 1
          fi
          if [ "${{ needs.changes.outputs.code }}" = "true" ] && \
             [ "${{ contains(needs.*.result, 'skipped') }}" = "true" ]; then
            exit 1
          fi
