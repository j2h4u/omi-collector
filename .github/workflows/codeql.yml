name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "27 7 * * 1"
  workflow_dispatch:

jobs:
  analyze:
    name: Analyze Python
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Release metadata needs no code analysis
        if: ${{ github.event_name == 'pull_request' && startsWith(github.event.pull_request.head.ref, 'release-please--') }}
        run: echo "release PR changes package metadata only"

      - name: Checkout
        if: ${{ github.event_name != 'pull_request' || !startsWith(github.event.pull_request.head.ref, 'release-please--') }}
        uses: actions/checkout@v7.0.1

      - name: Detect code scanning availability
        if: ${{ github.event_name != 'pull_request' || !startsWith(github.event.pull_request.head.ref, 'release-please--') }}
        id: code-scanning
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${{ github.repository }}/code-scanning/alerts" >/dev/null 2>&1; then
            echo "upload=always" >> "$GITHUB_OUTPUT"
          else
            echo "upload=never" >> "$GITHUB_OUTPUT"
          fi

      - name: Initialize CodeQL
        if: ${{ github.event_name != 'pull_request' || !startsWith(github.event.pull_request.head.ref, 'release-please--') }}
        uses: github/codeql-action/init@v4.37.9
        with:
          languages: python
          queries: security-extended

      - name: Perform CodeQL Analysis
        if: ${{ github.event_name != 'pull_request' || !startsWith(github.event.pull_request.head.ref, 'release-please--') }}
        uses: github/codeql-action/analyze@v4.37.9
        with:
          category: "/language:python"
          upload: ${{ steps.code-scanning.outputs.upload }}
