name: Dependency review

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      base-ref:
        description: Base revision for a manually dispatched comparison
        required: false
        default: main
      head-ref:
        description: Head revision for a manually dispatched comparison
        required: false

permissions:
  contents: read

jobs:
  submit-dependency-graphs:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout base revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.base-ref || github.event.pull_request.base.sha || github.event.repository.default_branch }}
          path: dependency-source
          persist-credentials: false

      - name: Checkout uv dependency submitter
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: rmuir/uv-dependency-submission
          ref: 8c650a3e5e519b93e604e644f7a4a3953144babe # v1.1.1
          path: .dependency-submission
          persist-credentials: false

      - name: Set up Python for dependency submission
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Submit base uv.lock dependency graph
        env:
          BASE_REF: refs/heads/${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
        working-directory: dependency-source
        run: GITHUB_SHA="$(git rev-parse HEAD)" GITHUB_REF="${BASE_REF}" python "$GITHUB_WORKSPACE/.dependency-submission/action.py"

      - name: Checkout head revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.head-ref || github.event.pull_request.head.sha || github.sha }}
          path: dependency-source
          persist-credentials: false

      - name: Submit head uv.lock dependency graph
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.event.pull_request.head.ref && format('refs/heads/{0}', github.event.pull_request.head.ref) || github.ref }}
        working-directory: dependency-source
        run: GITHUB_SHA="$(git rev-parse HEAD)" GITHUB_REF="${HEAD_REF}" python "$GITHUB_WORKSPACE/.dependency-submission/action.py"

  dependency-review:
    needs: submit-dependency-graphs
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Require successful dependency graph submission
        if: needs.submit-dependency-graphs.result != 'success'
        run: |
          echo "::error::dependency graph submission did not succeed"
          exit 1

      - name: Dependency review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: ${{ github.event_name == 'pull_request' && 'always' || 'never' }}
          retry-on-snapshot-warnings: true
          base-ref: ${{ inputs.base-ref || github.event.pull_request.base.sha || github.event.repository.default_branch }}
          head-ref: ${{ inputs.head-ref || github.event.pull_request.head.sha || github.sha }}
