name: Dependency review

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      base-ref:
        description: Base revision for a manually dispatched comparison
        required: false
        default: main
      head-ref:
        description: Head revision for a manually dispatched comparison
        required: false

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Dependency review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: ${{ github.event_name == 'pull_request' && 'always' || 'never' }}
          base-ref: ${{ inputs.base-ref || github.event.pull_request.base.sha || github.event.repository.default_branch }}
          head-ref: ${{ inputs.head-ref || github.event.pull_request.head.sha || github.sha }}
