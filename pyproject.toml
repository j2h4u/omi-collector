[project]
name = "omi-collector"
version = "1.1.8"
description = "Self-hosted collector for offline audio from an Omi CV1 pendant."
readme = "README.md"
license = "PolyForm-Noncommercial-1.0.0"
requires-python = ">=3.14"
dependencies = [
    "bleak>=1.1.1",
    "dbus-fast==5.2.0",
    "typer>=0.26.7",
]

[project.scripts]
omi-collector = "omi_collector.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/omi_collector"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
timeout = 120
timeout_method = "thread"
tmp_path_retention_policy = "failed"
tmp_path_retention_count = 1
addopts = [
    # Architecture checks run explicitly; preserve full pytest selection.
    "-p", "no:tach",
    "--strict-config",
    "--strict-markers",
    "-W",
    "error",
]
xfail_strict = true
markers = [
    "integration: tests that cross process, service, container, or network boundaries",
    "slow: tests that are too slow for the default unit gate",
]

[tool.ruff]
src = ["src", "scripts", "tests"]
line-length = 120
target-version = "py314"
extend-exclude = [".planning"]

[tool.ruff.lint]
explicit-preview-rules = true
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "I",
    "B",
    "BLE",
    "UP",
    "C4",
    "PIE",
    "RET",
    "ISC",
    "RSE",
    "FLY",
    "FURB",
    "RUF",
    "PERF",
    "SIM",
    "PTH",
    "DTZ",
    "PGH",
    "PLE",
    "LOG",
    "G",
    "N818",
    "ARG",
    "S",
    "C90",
    "PLR09",
    "PLR17",
    "PLR2004",
]
ignore = ["ISC001"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "DTZ",
    "PERF401",
    "PLR2004",
    "S101", # pytest assertions are executable test expectations.
]
# Reviewed local subprocesses, test fixtures, controlled SQL and fail-safe diagnostics.
"scripts/bench_omic16_internal_sqlite.py" = ["S101", "S108", "S603"]
"scripts/check_packaging_smoke.py" = ["S603"]
"scripts/clone_tools.py" = ["S603"]
"scripts/docker_qa_entrypoint.py" = ["S603", "S606", "S607"]
"scripts/mutation_campaign.py" = ["S101", "S105", "S603", "S607"]
"scripts/mutation_scope.py" = ["S108", "S607"]
"scripts/validate_pr_commits.py" = ["S603"]
"src/omi_collector/capture/adapters/internal_audio_store.py" = ["S101", "S608"]
"src/omi_collector/capture/adapters/quality_metrics.py" = ["S112"]
"src/omi_collector/capture/adapters/quarantine.py" = ["S101", "S608"]
"src/omi_collector/capture/adapters/staging_store.py" = ["S101", "S608"]
"src/omi_collector/capture/application/operational_telemetry.py" = ["S101", "S607"]
"src/omi_collector/cli.py" = ["S101", "S110", "S603"]
"src/omi_collector/capture/adapters/attempt_writer.py" = ["S101"]
"src/omi_collector/capture/adapters/ble_link_observability.py" = ["S101"]
"src/omi_collector/capture/adapters/operational_status.py" = ["S101"]
"src/omi_collector/capture/adapters/ready_bundles.py" = ["S101"]
"src/omi_collector/capture/adapters/sqlite_compaction.py" = ["S101"]
"src/omi_collector/capture/adapters/staging_writer.py" = ["S101"]
"src/omi_collector/capture/application/batch_reconciliation.py" = ["S101"]
"src/omi_collector/capture/application/collector.py" = ["S101"]
"src/omi_collector/capture/application/opportunistic_sync.py" = ["S101"]
"src/omi_collector/capture/application/session_lifecycle.py" = ["S101"]
"src/omi_collector/capture/domain/internal_audio_machine.py" = ["S101"]
"tests/test_architecture_contracts.py" = ["S603", "S607"]
"tests/test_ble_phy_reporting.py" = ["S603"]
"tests/test_cli.py" = ["S603"]
"tests/test_collector_state_db.py" = ["S603"]
"tests/test_crap_local_classes.py" = ["S102"]
"tests/test_debug_logging.py" = ["S102", "S105", "S108", "S603"]
"tests/test_device_cli.py" = ["S603"]
"tests/test_import_contracts.py" = ["S603"]
"tests/test_import_isolation.py" = ["S603"]
"tests/test_internal_audio_migration.py" = ["S603", "S608"]
"tests/test_internal_audio_projection.py" = ["S608"]
"tests/test_internal_audio_store.py" = ["S608"]
"tests/test_mutation_campaign.py" = ["S105", "S603", "S607"]
"tests/test_mutation_cli_recipes.py" = ["S603"]
"tests/test_mutation_integration.py" = ["S607"]
"tests/test_mutation_scope.py" = ["S105", "S603", "S608"]
"tests/test_ogg_opus.py" = ["S603"]
"tests/test_pr_commit_validation.py" = ["S603", "S607"]
"tests/test_public_audio_v2_integration.py" = ["S608"]
"tests/test_public_audio_v2_permissions.py" = ["S608"]
"tests/test_public_drain.py" = ["S603"]
"tests/test_publication_recovery.py" = ["S106"]
"tests/test_release_tag_identity.py" = ["S603", "S607"]
"tests/test_runtime_smoke.py" = ["S607"]
"tests/test_slow_disk_force_exit.py" = ["S603"]
"tests/test_sqlite_compaction.py" = ["S603"]
"tests/test_staging_contract.py" = ["S603"]
"tests/test_staging_quarantine.py" = ["S608"]
"tests/test_systemd_unit.py" = ["S603", "S607"]

[tool.ruff.format]
quote-style = "double"

[tool.pyright]
include = ["src/omi_collector", "scripts", "tests"]
pythonVersion = "3.14"
typeCheckingMode = "standard"
reportAny = "error"
reportExplicitAny = "error"
reportUnknownVariableType = "none"
reportUnknownArgumentType = "none"
reportUnknownMemberType = "none"
reportUnknownParameterType = "none"
reportUnknownLambdaType = "none"
reportMissingParameterType = "error"
reportMissingTypeArgument = "none"
reportUnannotatedClassAttribute = "none"
reportUnusedCallResult = "none"
reportImplicitStringConcatenation = "none"
reportPrivateUsage = "none"

[[tool.pyright.executionEnvironments]]
root = "src"
reportUnknownVariableType = "error"
reportUnknownArgumentType = "error"
reportUnknownMemberType = "error"
reportUnknownParameterType = "error"
reportUnknownLambdaType = "error"
reportMissingTypeArgument = "error"

[tool.vulture]
paths = ["src/omi_collector", "scripts", "tests"]
min_confidence = 80
ignore_decorators = [
    "@app.callback",
    "@app.command",
]

[tool.coverage.run]
source = ["src/omi_collector"]
branch = true
sigterm = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.importlinter]
root_package = "omi_collector"
include_external_packages = true

[tool.deptry]
known_first_party = ["omi_collector", "scripts"]

[tool.omi_collector.suppressions]
paths = ["src", "scripts", "tests", "pyproject.toml", "Justfile", ".github/workflows"]

# Initial historical count ceilings; review new/changed inline suppressions per PR.
# Lower these ceilings when suppressions are removed. Native TOML ignores are not counted.
[tool.omi_collector.suppressions.baseline]
noqa = 114
type_ignore = 190
pyright = 0
pylint = 0
ruff = 0

[[tool.importlinter.contracts]]
id = "core-independent-from-cli"
name = "Core stays independent from CLI"
type = "forbidden"
source_modules = ["omi_collector.core"]
forbidden_modules = ["omi_collector.cli"]

[[tool.importlinter.contracts]]
id = "capture-domain-independent-from-outer-layers"
name = "Capture domain stays independent from application, adapters, and CLI"
type = "forbidden"
source_modules = ["omi_collector.capture.domain"]
forbidden_modules = [
    "omi_collector.capture.application",
    "omi_collector.capture.adapters",
    "omi_collector.capture.cli",
]

[[tool.importlinter.contracts]]
id = "capture-application-uses-ports"
name = "Capture application stays independent from adapters and Bluetooth"
type = "forbidden"
source_modules = ["omi_collector.capture.application"]
forbidden_modules = ["omi_collector.capture.adapters", "bleak", "dbus_fast"]

[tool.pytest-gremlins]
paths = ["src/omi_collector", "scripts"]
report = ["console", "html", "json"]
workers = 2
timeout = 150
full_suite_timeout = 600
cache = true
lightweight_runner = false

[tool.uv.sources]
pytest-gremlins = { git = "https://github.com/j2h4u/pytest-gremlins", rev = "d5c4d18d9b7b08d588e42e9ea92a9773f182df60" }

[dependency-groups]
dev = [
    "actionlint-py>=1.7.12.24",
    "basedpyright>=1.39.8",
    "deptry>=0.25.1",
    "import-linter>=2.12",
    "jscpd==5.4.2",
    "pip-audit>=2.10.1",
    "pytest>=9.1.1",
    "pytest-cov>=7",
    "pytest-crap>=0.3.0",
    "pytest-gremlins",
    "pytest-timeout>=2.4,<2.5",
    "pytest-xdist>=3.8.0",
    "pyscn==1.33.1",
    "radon>=6.0.1",
    "ruff>=0.15.18",
    "vulture>=2.16",
    "tach>=0.35.0",
    "coverage>=7.14.3",
    "hypothesis>=6,<7",
]
